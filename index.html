    // expose for inline handlers
    window.startQuiz = startQuiz;
    window.selectOption = selectOption;
    window.handleInfoSubmit = handleInfoSubmit;

    // ---------- persistence ----------
    function getQuizDocRef(){ return doc(db,'artifacts',appId,'users',userId,'quiz_results','current'); }
    function getLocalKey(){ const uid=(typeof userId!=='undefined'&&userId&&userId!=='loading')?userId:'anon'; return `${appId||'default'}__${uid}__quiz_state_v1`; }
    function saveStateToLocal(){
      try{ const s={userInfo,currentQuestionIndex,answerHistory,resultData,hasSavedResult}; localStorage.setItem(getLocalKey(),JSON.stringify(s)); }catch(e){ console.warn(e); }
    }
    function loadStateFromLocal(){
      try{
        const raw=localStorage.getItem(getLocalKey()); if(!raw) return false;
        const s=JSON.parse(raw);
        userInfo=s.userInfo||{}; currentQuestionIndex=s.currentQuestionIndex||0;
        answerHistory=Array.isArray(s.answerHistory)?s.answerHistory:answerHistory;
        resultData=s.resultData||null; hasSavedResult=!!s.hasSavedResult; return true;
      }catch(e){ console.warn(e); return false;}
    }
    async function saveQuizStateToFirestore(){
      if(isMock||!isAuthReady||userId==='anonymous'){ saveStateToLocal(); return; }
      const state={userInfo,currentQuestionIndex,answerHistory:JSON.stringify(answerHistory),resultData:resultData?JSON.stringify(resultData):null,hasSavedResult,updatedAt:new Date().toISOString()};
      try{ await setDoc(getQuizDocRef(),state,{merge:true}); }catch(e){ console.error(e); saveStateToLocal(); }
    }
    async function loadQuizStateFromFirestore(){
      if(isMock||!isAuthReady||userId==='anonymous'){
        const ok=loadStateFromLocal(); if(ok){ restoreInfoSelections(); } return ok;
      }
      try{
        const snap=await getDoc(getQuizDocRef());
        if(snap.exists()){
          const d=snap.data();
          userInfo=d.userInfo||{}; restoreInfoSelections();
          currentQuestionIndex=d.currentQuestionIndex||0;
          try{ answerHistory=d.answerHistory?JSON.parse(d.answerHistory):Array(totalQuestions).fill(null); }catch{ answerHistory=Array(totalQuestions).fill(null); }
          hasSavedResult=!!d.hasSavedResult; resultData=d.resultData?JSON.parse(d.resultData):null; saveStateToLocal(); return true;
        }
        const ok=loadStateFromLocal(); if(ok) restoreInfoSelections(); return ok;
      }catch(e){ console.error(e); const ok=loadStateFromLocal(); if(ok) restoreInfoSelections(); return ok; }
    }
    function restoreInfoSelections(){
      document.getElementById('user-name').value=userInfo.name||'';
      ['gender','age','experience'].forEach(g=>{
        if(userInfo[g]){
          const btn=document.querySelector(`#${g}-group button[data-value="${userInfo[g]}"]`);
          if(btn) btn.classList.add('btn-selected');
        }
      });
    }

    // ---------- UI helpers ----------
    function showSection(id){
      ['home-section','info-section','quiz-section','result-section'].forEach(s=>{
        const el=document.getElementById(s); if(el) el.classList.toggle('hidden', s!==id);
      });
      window.scrollTo(0,0);
    }
    async function startQuiz(isResume){
      if(isResume){
        if(hasSavedResult&&resultData){ showResult(resultData.code); return; }
        if(currentQuestionIndex>0){ showSection('quiz-section'); renderQuestion(currentQuestionIndex); return; }
      }else{
        userInfo={name:'',gender:'',age:'',experience:''};
        document.getElementById('user-name').value='';
        document.querySelectorAll('#gender-group .btn-selected,#age-group .btn-selected,#experience-group .btn-selected').forEach(b=>b.classList.remove('btn-selected'));
        currentQuestionIndex=0; answerHistory=Array(totalQuestions).fill(null); selectedChoiceValue=null; resultData=null; hasSavedResult=false;
        await saveQuizStateToFirestore();
      }
      document.getElementById('info-error-message').classList.add('hidden');
      showSection('info-section');
      ['gender','age','experience'].forEach(g=>{
        const v=userInfo[g]; if(v){ const btn=document.querySelector(`#${g}-group button[data-value="${v}"]`); if(btn) btn.classList.add('btn-selected');}
      });
    }
    function selectOption(group,value,el){
      const wrap=document.getElementById(`${group}-group`);
      wrap.querySelectorAll('.btn-option').forEach(b=>b.classList.remove('btn-selected'));
      el.classList.add('btn-selected'); userInfo[group]=value; document.getElementById('info-error-message').classList.add('hidden');
    }
    async function handleInfoSubmit(){
      userInfo.name=document.getElementById('user-name').value.trim();
      const ok=['name','gender','age','experience'].every(f=>userInfo[f]&&userInfo[f]!=='' );
      const err=document.getElementById('info-error-message'); if(!ok){ err.classList.remove('hidden'); return; }
      await saveQuizStateToFirestore();
      err.classList.add('hidden'); showSection('quiz-section'); renderQuestion(currentQuestionIndex);
    }
    function showMessage(msg,d=3000){
      const box=document.getElementById('message-box'); box.textContent=msg; box.classList.remove('hidden');
      setTimeout(()=>box.classList.add('visible'),10);
      setTimeout(()=>{ box.classList.remove('visible'); setTimeout(()=>box.classList.add('hidden'),300); },d);
    }

    // ======= 自動縮字以「單行顯示、不換行」的工具 =======
    function fitOneLine(el,{minRem=0.8,maxRem=1.2,step=0.02}={}){
      el.style.whiteSpace='nowrap';
      let size=parseFloat(getComputedStyle(el).fontSize)/16; // rem
      size=Math.min(size,maxRem);
      const maxWidth=el.clientWidth; // 可用寬度（含padding）
      // 若本來沒超出就嘗試放大到上限
      while(size+step<=maxRem){
        el.style.fontSize=`${(size+step)}rem`;
        if(el.scrollWidth>el.clientWidth){ el.style.fontSize=`${size}rem`; break; }
        size+=step;
      }
      // 若仍超出就往下縮
      while(el.scrollWidth>el.clientWidth && size-step>=minRem){
        size-=step; el.style.fontSize=`${size}rem`;
      }
      return size;
    }

    // 對一組按鈕求「同一頁一致字級」且都單行
    function fitOptionsUniform(optionsNodeList,{minRem=0.85,maxRem=1.05}={}){
      let target=maxRem;
      optionsNodeList.forEach(btn=>{
        btn.style.whiteSpace='nowrap';
        btn.style.fontSize=`${maxRem}rem`;
        // 若超出就逐步下降直到單行
        let size=maxRem;
        while(btn.scrollWidth>btn.clientWidth && size>minRem){
          size -= 0.02; btn.style.fontSize=`${size}rem`;
        }
        target=Math.min(target,size);
      });
      // 套同一字級
      optionsNodeList.forEach(btn=>btn.style.fontSize=`${target}rem`);
      return target;
    }

    function renderQuestion(index){
      currentQuestionIndex=index;
      const q=quizQuestions[index];
      const saved=answerHistory[index];
      selectedChoiceValue=saved?saved.choice:null;

      const area=document.getElementById('question-area');
      area.innerHTML = `
        <div class="question-text">Q${index+1}. ${q.q}</div>
        <div id="options-container" class="option-group-full">
          ${q.options.map((t,i)=>{
            const choice=String.fromCharCode(65+i);
            const sel=selectedChoiceValue===choice?'btn-selected':'';
            return `<button class="btn btn-option ${sel}" data-choice="${choice}" onclick="selectAnswer(${index},'${choice}',this)"><span>${choice}. </span><span>${t}</span></button>`;
          }).join('')}
        </div>
      `;

      document.getElementById('current-progress').textContent=`${index+1}/${totalQuestions}`;
      document.getElementById('progress-fill').style.width=`${((index+1)/totalQuestions)*100}%`;
      document.getElementById('back-button').disabled = index===0;
      document.getElementById('next-button').textContent = index===totalQuestions-1 ? '看結果！':'下一題';
      document.getElementById('quiz-error-message').classList.add('hidden');

      // ===== 手機特殊題目(Q1、Q5、Q6)單行處理與同頁一致字級 =====
      if (window.matchMedia('(max-width: 480px)').matches && [0,4,5].includes(index)){
        const nodes = area.querySelectorAll('#options-container .btn-option');
        // 依照你的觀察「常從倒數第二/第三個字換行」，這裡直接以容器可用寬度計算，求同一頁的最大可用字級
        fitOptionsUniform(nodes,{minRem:0.86,maxRem:1.02});
      } else {
        // 其他題恢復預設 1rem
        const nodes = area.querySelectorAll('#options-container .btn-option');
        nodes.forEach(n=>n.style.fontSize='1rem');
      }
      saveQuizStateToFirestore();
    }

    function selectAnswer(qIndex,choice,el){
      const wrap=document.getElementById('options-container');
      wrap.querySelectorAll('.btn-option').forEach(b=>b.classList.remove('btn-selected'));
      el.classList.add('btn-selected'); selectedChoiceValue=choice;
      document.getElementById('quiz-error-message').classList.add('hidden');

      const qNum=qIndex+1; const score=scoreMap[qNum][choice];
      answerHistory[qIndex]={q:qNum,choice,scoreCode:score};
      saveQuizStateToFirestore();
    }
    function nextQuestion(){
      if(!selectedChoiceValue){ document.getElementById('quiz-error-message').classList.remove('hidden'); return; }
      document.getElementById('quiz-error-message').classList.add('hidden');
      if(currentQuestionIndex===totalQuestions-1){ calculateResult(); } else { renderQuestion(currentQuestionIndex+1); }
    }
    function prevQuestion(){ if(currentQuestionIndex>0) renderQuestion(currentQuestionIndex-1); }

    function calculateResult(){
      const cnt={ASC:0,ARC:0,ISC:0,IRN:0};
      answerHistory.forEach(a=>{ if(a&&cnt.hasOwnProperty(a.scoreCode)) cnt[a.scoreCode]++; });
      let max=-1,code='';
      for(const k in cnt){
        if(cnt[k]>max){max=cnt[k]; code=k;}
        else if(cnt[k]===max){ if(code===''||k.localeCompare(code)<0) code=k; }
      }
      resultData = {...personae[code], code};
      hasSavedResult=true; saveQuizStateToFirestore(); showResult(code);
    }

    function showResult(code){
      const r=resultData; showSection('result-section');
      const name=userInfo.name && userInfo.name!=='' ? userInfo.name : '理財探索者';
      document.getElementById('result-pre-greeting').innerHTML=`嗨，${name}<br>你的理財人格結果出爐✨`;

      document.getElementById('result-display-area').innerHTML = `
        <div class="result-code">${code}</div>
        <div class="result-name"><span class="main">${r.name}</span><span class="sub">${r.subName}</span></div>
        <div class="result-tagline" style="font-size:1rem;font-weight:500;color:var(--text-light);text-align:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px dashed #e5e7eb;">「${r.tagline}」</div>

        <div class="result-section-title description-color">描述 (DESCRIPTION)</div>
        <div class="content-section content-section-description"><p>${r.description}</p></div>

        <div class="result-section-title advice-color">投資小學堂 (ADVICE)</div>
        <div class="content-section content-section-advice"><p>${r.advice}</p></div>
      `;

      document.getElementById('personal-summary').innerHTML =
        `根據你的年齡 (${userInfo.age}) 和投資經驗 (${userInfo.experience})，你的潛力為 ${r.tagline}！繼續保持你的優勢吧。`;

      // 結果頁兩顆按鈕：行動端不換行且同字級
      const dlBtn=document.getElementById('download-button');
      const reBtn=document.getElementById('restart-button');
      if (window.matchMedia('(max-width: 480px)').matches){
        const s1=fitOneLine(dlBtn,{minRem:0.9,maxRem:1.1});
        reBtn.style.fontSize=`${s1}rem`; fitOneLine(reBtn,{minRem:0.9,maxRem:1.1});
      }
    }

    function resetQuiz(){
      userInfo={name:'',gender:'',age:'',experience:''};
      currentQuestionIndex=0; answerHistory=Array(totalQuestions).fill(null);
      selectedChoiceValue=null; resultData=null; hasSavedResult=false;
      document.getElementById('user-name').value='';
      document.querySelectorAll('.btn-selected').forEach(b=>b.classList.remove('btn-selected'));
      saveQuizStateToFirestore(); showSection('home-section'); showMessage('測驗已重置，歡迎再次探索！',2000);
    }

    // ====== 分享：直接分享 PNG 圖片（Web Share Level 2），不再丟連結 ======
    async function downloadResultImage(){
      const element=document.getElementById('result-card-to-capture');
      const name=userInfo.name && userInfo.name!=='' ? userInfo.name : '理財探索者';
      const fileName=`${name}_理財DNA測驗結果.png`;

      try{
        const canvas = await html2canvas(element,{scale:2,useCORS:true,backgroundColor:'#ffffff'});
        const blob = await new Promise(res=>canvas.toBlob(b=>res(b),'image/png',1));
        // 若瀏覽器支援分享圖片（大多數 Android/部分 iOS）
        if (blob && navigator.canShare && navigator.canShare({ files: [new File([blob],'x.png',{type:'image/png'})] })) {
          const file = new File([blob], fileName, {type:'image/png'});
          await navigator.share({ files:[file], text:`我的理財人格：${resultData?.name}` });
          return;
        }
        // 退而求其次：直接下載圖片
        const link=document.createElement('a'); link.download=fileName; link.href=URL.createObjectURL(blob); link.click();
        showMessage('結果圖片已自動下載！');
      }catch(err){
        console.error('分享/下載失敗',err); showMessage('無法分享圖片，已改為下載。');
      }
    }

    // ====== Init ======
    async function init(){
      // 讓首頁「馬上開始 👉」在行動端維持單行
      const startBtn=document.getElementById('start-quiz-button');
      if (window.matchMedia('(max-width: 480px)').matches){ fitOneLine(startBtn,{minRem:0.95,maxRem:1.05}); }

        const ok=loadStateFromLocal();
        setHomeStartButton();
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
        return;
      }
      try{
        const app=initializeApp(firebaseConfig); db=getFirestore(app); auth=getAuth(app);
        if(typeof __initial_auth_token!=='undefined'){ await signInWithCustomToken(auth,__initial_auth_token); } else { await signInAnonymously(auth); }
        userId=auth.currentUser?.uid||'anonymous'; isAuthReady=true;

        const loaded=await loadQuizStateFromFirestore();
        setHomeStartButton();
        document.getElementById('user-info-id').textContent=`User ID (跨平台連動識別碼): ${userId}`;
        document.getElementById('user-info-id').classList.remove('hidden');
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
      }catch(e){
        console.error('Firebase init failed, fallback local',e);
        const ok=loadStateFromLocal(); setHomeStartButton();
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
      }

      // 視窗改變時，重新微調目前畫面的單行排版
      window.addEventListener('resize', ()=>{
        const secIds=['home-section','quiz-section','result-section'];
        if(!secIds.some(id=>!document.getElementById(id).classList.contains('hidden'))) return;
      });
    }

    function setHomeStartButton(){
      const btn=document.getElementById('start-quiz-button');
      if (hasSavedResult && resultData){ btn.textContent='查看我的結果 ✨'; btn.onclick=()=>showResult(resultData.code); }
      else if (currentQuestionIndex>0){ btn.textContent=`繼續測驗 (Q${currentQuestionIndex+1}/8) 🚀`; btn.onclick=()=>startQuiz(true); }
      else { btn.textContent='馬上開始 👉'; btn.onclick=()=>startQuiz(false); }
      if (window.matchMedia('(max-width: 480px)').matches){ fitOneLine(btn,{minRem:0.95,maxRem:1.05}); }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
